# 개발용 인프라. 실행: docker compose -f infra/docker-compose.dev.yml up -d
# 값은 개발용 기본값이며, 바꾸려면 같은 이름의 환경 변수를 지정한다 (.env.example 참고).
name: api-monitor-dev

services:
  mariadb:
    image: mariadb:11.8
    container_name: api-monitor-mariadb
    environment:
      MARIADB_DATABASE: ${DB_NAME:-api_monitor}
      MARIADB_USER: ${DB_USERNAME:-api_monitor}
      MARIADB_PASSWORD: ${DB_PASSWORD:-api_monitor_local}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      # 같은 PC에서만 접속할 수 있게 127.0.0.1에만 연다.
      # 다른 프로젝트의 MariaDB(3306)와 겹치지 않도록 기본 포트는 3307을 쓴다.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 관측성 도구는 필요할 때만 띄운다.
  # 실행: docker compose -f infra/docker-compose.dev.yml --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: api-monitor-prometheus
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # PC에서 실행 중인 앱(관리 포트 8081)에 접근하기 위한 주소
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.3.1
    container_name: api-monitor-grafana
    profiles: [observability]
    depends_on:
      - prometheus
      - loki
    environment:
      # 개발용: 같은 PC(127.0.0.1)에서만 열리므로 로그인 없이 보기 권한으로 연다. 운영 설정은 20단계에서 정한다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_local}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api-monitor.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

  # 로그 저장과 검색. Grafana가 내부 네트워크로만 접근하므로 포트를 PC에 열지 않는다.
  loki:
    image: grafana/loki:3.7.10
    container_name: api-monitor-loki
    profiles: [observability]
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  # 로그 수집. PC에서 실행 중인 앱이 쓰는 backend/logs/를 읽기 전용으로 읽어 Loki로 보낸다.
  alloy:
    image: grafana/alloy:v1.22.0
    container_name: api-monitor-alloy
    profiles: [observability]
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../backend/logs:/var/log/api-monitor:ro
    ports:
      # 수집 상태를 확인하는 Alloy 화면
      - "127.0.0.1:12345:12345"

  # 부하 테스트 (docs/07-load-test.md). 실행: docker compose -f infra/docker-compose.dev.yml --profile loadtest up -d loadtest-target
  # 검사 대상 가짜 서버. 앱이 PC에서 127.0.0.1:18080으로 호출한다.
  loadtest-target:
    image: wiremock/wiremock:3.13.2
    container_name: api-monitor-loadtest-target
    profiles: [loadtest]
    command:
      - --disable-banner
      - --no-request-journal         # 요청 기록을 쌓지 않아 메모리가 늘지 않게 한다
      - --async-response-enabled=true # 지연 응답 중에 스레드를 붙잡지 않는다
      - --container-threads=300
    volumes:
      - ./k6/wiremock:/home/wiremock:ro
    ports:
      - "127.0.0.1:18080:8080"

  # API 부하 도구. 실행 방법은 docs/07-load-test.md 참고 (docker compose run --rm k6 ...)
  k6:
    image: grafana/k6:2.4.0
    profiles: [loadtest]
    volumes:
      - ./k6:/scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mariadb-data:
  prometheus-data:
  grafana-data:
  loki-data:
