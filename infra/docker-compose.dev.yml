# 개발용 인프라. 실행: docker compose -f infra/docker-compose.dev.yml up -d
# 값은 개발용 기본값이며, 바꾸려면 같은 이름의 환경 변수를 지정한다 (.env.example 참고).
name: api-monitor-dev

services:
  mariadb:
    image: mariadb:11.8
    container_name: api-monitor-mariadb
    environment:
      MARIADB_DATABASE: ${DB_NAME:-api_monitor}
      MARIADB_USER: ${DB_USERNAME:-api_monitor}
      MARIADB_PASSWORD: ${DB_PASSWORD:-api_monitor_local}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      # 같은 PC에서만 접속할 수 있게 127.0.0.1에만 연다.
      # 다른 프로젝트의 MariaDB(3306)와 겹치지 않도록 기본 포트는 3307을 쓴다.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 관측성 도구는 필요할 때만 띄운다.
  # 실행: docker compose -f infra/docker-compose.dev.yml --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: api-monitor-prometheus
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # PC에서 실행 중인 앱(관리 포트 8081)에 접근하기 위한 주소
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.3.1
    container_name: api-monitor-grafana
    profiles: [observability]
    depends_on:
      - prometheus
    environment:
      # 개발용: 같은 PC(127.0.0.1)에서만 열리므로 로그인 없이 보기 권한으로 연다. 운영 설정은 20단계에서 정한다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_local}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api-monitor.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mariadb-data:
  prometheus-data:
  grafana-data:
