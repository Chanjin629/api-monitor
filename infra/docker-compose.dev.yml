# 개발용 인프라. 실행: docker compose -f infra/docker-compose.dev.yml up -d
# 값은 개발용 기본값이며, 바꾸려면 같은 이름의 환경 변수를 지정한다 (.env.example 참고).
name: api-monitor-dev

services:
  mariadb:
    image: mariadb:11.8
    container_name: api-monitor-mariadb
    environment:
      MARIADB_DATABASE: ${DB_NAME:-api_monitor}
      MARIADB_USER: ${DB_USERNAME:-api_monitor}
      MARIADB_PASSWORD: ${DB_PASSWORD:-api_monitor_local}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      # 같은 PC에서만 접속할 수 있게 127.0.0.1에만 연다.
      # 다른 프로젝트의 MariaDB(3306)와 겹치지 않도록 기본 포트는 3307을 쓴다.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mariadb-data:
