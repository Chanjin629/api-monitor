# 개발용 Loki 설정. 컨테이너 하나에 모든 기능을 띄우고(monolithic), 로그는 컨테이너 볼륨에 저장한다.
# 운영 설정(보관 기간, 저장 위치)은 20단계에서 정한다.
auth_enabled: false  # 사용자(tenant)를 나누지 않는다. 외부에 포트를 열지 않으므로 인증도 두지 않는다.

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13  # traceId를 구조화 메타데이터로 저장하려면 v13이 필요하다.
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h  # 7일
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true  # 보관 기간이 지난 로그를 실제로 지운다.
  delete_request_store: filesystem

analytics:
  reporting_enabled: false  # 사용 통계를 Grafana Labs로 보내지 않는다.
