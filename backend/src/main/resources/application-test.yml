# 테스트 설정. DB 연결 정보는 Testcontainers가 주입한다.
spring:
  security:
    oauth2:
      client:
        registration:
          github:
            # 테스트는 실제 GitHub를 호출하지 않는다.
            client-id: test-client-id
            client-secret: test-client-secret

auth:
  jwt:
    secret: SvgvwpW6j+qJC0CMWj8GY4tsmcgSImJ9q1A5RYilO90=
  cookie:
    secure: false

crypto:
  secret: i+RSNH2n2xUbjYhYY7fX0gt90FUzjUInH7OvAXxIiyY=

check:
  # 다른 테스트 중에 등록한 모니터가 실제로 외부 호출되지 않도록 주기 실행을 끈다.
  # 디스패처 테스트는 dispatch()를 직접 호출한다.
  dispatcher-enabled: false

notification:
  # 발송기 테스트는 sendDue()를 직접 호출한다.
  sender-enabled: false

management:
  server:
    # 테스트(MockMvc)는 실제 포트를 열지 않으므로, 관리 엔드포인트를 앱과 같은 곳에 두어 확인한다.
    port: 8080
  prometheus:
    metrics:
      export:
        # Spring Boot는 테스트에서 메트릭 내보내기를 기본으로 끈다. /actuator/prometheus를 확인하려고 켠다.
        enabled: true

demo:
  # 데모 데이터 테스트는 seed()를 직접 호출한다.
  seed-enabled: false

ratelimit:
  # 테스트들은 같은 IP(127.0.0.1)로 많은 요청을 보내므로 끈다. 요청 제한 테스트만 켜서 확인한다.
  enabled: false

logging:
  level:
    org.flywaydb: warn
