# 테스트 설정. DB 연결 정보는 Testcontainers가 주입한다.
spring:
  security:
    oauth2:
      client:
        registration:
          github:
            # 테스트는 실제 GitHub를 호출하지 않는다.
            client-id: test-client-id
            client-secret: test-client-secret

auth:
  jwt:
    secret: SvgvwpW6j+qJC0CMWj8GY4tsmcgSImJ9q1A5RYilO90=
  cookie:
    secure: false

crypto:
  secret: i+RSNH2n2xUbjYhYY7fX0gt90FUzjUInH7OvAXxIiyY=

check:
  # 다른 테스트 중에 등록한 모니터가 실제로 외부 호출되지 않도록 주기 실행을 끈다.
  # 디스패처 테스트는 dispatch()를 직접 호출한다.
  dispatcher-enabled: false

notification:
  # 발송기 테스트는 sendDue()를 직접 호출한다.
  sender-enabled: false

logging:
  level:
    org.flywaydb: warn
