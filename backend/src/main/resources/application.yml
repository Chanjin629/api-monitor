spring:
  application:
    name: api-monitor
  profiles:
    # 프로필을 지정하지 않고 실행하면 로컬 개발 설정을 쓴다.
    default: local
  jpa:
    # 화면 렌더링 중에 DB 연결을 붙잡고 있지 않도록 끈다.
    open-in-view: false
    hibernate:
      # 테이블은 Flyway가 만들고, JPA는 엔티티와 테이블이 맞는지 검사만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Instant를 DATETIME 컬럼과 같은 TIMESTAMP 타입으로 다룬다.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      # 요청 제한 횟수를 센다. Redis가 느리거나 죽어도 API가 함께 느려지지 않도록 대기 시간을 짧게 둔다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            # 공개 프로필만 읽는다. 이메일과 저장소 권한은 요청하지 않는다.
            scope: read:user

auth:
  jwt:
    # 운영에서는 JWT_SECRET 환경 변수가 없으면 서버가 시작되지 않는다.
    secret: ${JWT_SECRET}
    issuer: api-monitor
    access-token-ttl: 15m
    demo-token-ttl: 60m
  refresh-token-ttl: 14d
  cookie:
    secure: true

crypto:
  # 요청 헤더 값 암호화 키. 운영에서는 CRYPTO_SECRET 환경 변수가 없으면 서버가 시작되지 않는다.
  secret: ${CRYPTO_SECRET}

check:
  # 검사 시각이 지난 모니터를 찾는 주기
  dispatch-interval-ms: 5000
  dispatcher-enabled: true
  # 한 번에 선점하는 최대 모니터 수와 동시 검사 수 (docs/01-requirements.md N-P2)
  batch-size: 200
  max-concurrency: 200

notification:
  # 예약된 알림을 Discord로 보내는 주기
  send-interval-ms: 5000
  sender-enabled: true

demo:
  # 데모 계정의 샘플 데이터를 서버 시작 시와 매일 현재 시각 기준으로 다시 만든다.
  seed-enabled: true

ratelimit:
  # IP·회원별 분당 요청 한도. 규칙은 RateLimitRule과 docs/02-architecture.md 6.1에 있다.
  enabled: true

management:
  server:
    # Actuator는 앱(8080)과 다른 관리 포트에서만 연다. 배포 시 Caddy는 8080만 외부에 연결한다.
    port: 8081
  endpoints:
    web:
      exposure:
        # 설정 값이나 환경 변수를 보여 주는 엔드포인트(env, configprops 등)는 열지 않는다.
        include: health, info, prometheus
  endpoint:
    health:
      # 관리 포트는 내부 네트워크에서만 접근하므로 DB 등 구성 요소별 상태를 보여 준다.
      show-components: always
  health:
    redis:
      # Redis가 죽어도 요청 제한만 건너뛰고 서비스는 정상이다(fail-open). 앱 상태를 DOWN으로 만들지 않는다.
      # Redis 장애는 apimonitor.ratelimit.errors 메트릭으로 본다.
      enabled: false
  metrics:
    tags:
      application: api-monitor
    distribution:
      # Prometheus에서 p95를 계산할 수 있게 히스토그램으로 내보낸다. (N-P3, N-P4)
      percentiles-histogram:
        http.server.requests: true
        apimonitor.check.dispatch.delay: true
        apimonitor.check.duration: true

logging:
  structured:
    format:
      # 파일 로그는 한 줄에 JSON 하나로 쓴다. Alloy가 읽어 Loki로 보내고, level·traceId를 필드로 찾는다.
      # 터미널 로그는 사람이 읽기 쉬운 기본 형식을 유지한다.
      file: logstash
  level:
    # 고객 API의 연결 오류(인증서 오류 등)는 정상적인 검사 결과다.
    # Reactor Netty가 오류마다 남기는 WARN 스택 트레이스는 로그를 채우고 고객 도메인을 노출하므로 끈다.
    reactor.netty.http.client.HttpClientConnect: error

springdoc:
  swagger-ui:
    path: /swagger-ui.html
