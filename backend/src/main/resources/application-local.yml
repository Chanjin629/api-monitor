# 로컬 개발 설정. DB는 infra/docker-compose.dev.yml로 실행한다.
spring:
  datasource:
    url: jdbc:mariadb://localhost:${DB_PORT:3307}/${DB_NAME:api_monitor}
    username: ${DB_USERNAME:api_monitor}
    password: ${DB_PASSWORD:api_monitor_local}
  data:
    redis:
      # 개발용 Redis(infra/docker-compose.dev.yml). 다른 프로젝트의 6379와 겹치지 않게 6380을 쓴다.
      port: ${REDIS_PORT:6380}

auth:
  jwt:
    # 로컬 개발 전용 키. 운영에서는 JWT_SECRET 환경 변수를 쓴다.
    secret: ${JWT_SECRET:xe5QWxyvyFVnRBeiXDawT6FyLGB7OLNwB91w/KCCidY=}
  cookie:
    # 로컬은 HTTP라서 Secure 쿠키를 쓰면 브라우저가 저장하지 않는다.
    secure: false

crypto:
  # 로컬 개발 전용 키. 운영에서는 CRYPTO_SECRET 환경 변수를 쓴다.
  secret: ${CRYPTO_SECRET:JQzQP0ee2rTUBZShO+OpCE+lM8o7ybpk0BT3otKOkVY=}

logging:
  file:
    # bootRun은 backend/에서 실행되므로 backend/logs/에 쓴다. Alloy 컨테이너가 이 폴더를 읽는다.
    name: logs/api-monitor.log
  logback:
    rollingpolicy:
      # 10MB마다 새 파일로 나누고 7일 지난 파일은 지운다.
      max-file-size: 10MB
      max-history: 7
